<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 · Clase 24 · Experto</title>
<style>
:root{--primary:#4B2363;--accent:#B37D48;--level:#9F1239;--ink:#0F172A;--bg:#F8FAFC;--card:#fff;--ok:#166534;--bad:#991B1B;--line:#CBD5E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#fff;border-top:6px solid var(--primary);border-bottom:5px solid var(--level);display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.logo{height:92px;width:auto;flex:0 0 auto}
.logo img{height:100%;width:auto;display:block}
@media(max-width:640px){header{position:static}.logo{height:80px}}
.badge{background:var(--level);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px}
.meta{margin-left:auto;font-weight:700;font-size:15px}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{height:10px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:4px 0 16px}
.bar>i{display:block;height:100%;background:var(--level);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.skill{display:inline-block;background:#E0E7FF;color:#1E1B4B;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.stem{font-size:19px;font-weight:600;margin:4px 0 12px}
.fig{border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px;background:#fff}
.fig svg{display:block;width:100%;height:auto;max-height:340px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;color:var(--ink);cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--level)}
.opt b{flex:0 0 32px;height:32px;border-radius:50%;background:var(--level);color:#fff;display:grid;place-items:center;font-size:15px}
.opt.ok{border-color:var(--ok);background:#DCFCE7}
.opt.bad{border-color:var(--bad);background:#FEE2E2}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:#F1F5F9;border-left:6px solid var(--level);display:none}
.btn{background:var(--level);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:800;cursor:pointer;margin-top:14px}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.big{font-size:44px;font-weight:900;color:var(--level)}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.tag-ok{color:var(--ok);font-weight:800}.tag-bad{color:var(--bad);font-weight:800}
</style>
</head>

o fijo + costo por unidad · n<\/text><\/svg>","o":["Antes del punto de cruce, conviene siempre el plan de mayor cargo fijo","Para comparar dos planes hay que considerar el cargo fijo y el costo por unidad","Dos tarifas lineales se cruzan en el uso en que sus costos son iguales","En C(n) = a + bn, a es el cargo fijo y b es el costo por unidad","Después del punto de cruce, conviene el plan de menor pendiente"],"s":"Argumentar","e":"Solo una afirmación contradice el modelo C(n) = a + bn."},{"q":"Una relación proporcional cumple f(2) = 24. ¿Cuánto vale f(8)?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Función lineal (proporcional): f(x) = kx\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Función lineal (proporcional):<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = kx<\/text><\/svg>","o":["96","108","32","84","192"],"s":"Resolver problemas","e":"f(x) = 12x, luego f(8) = 96."},{"q":"Para un club deportivo se comparan dos planes: el A cobra $3.000 más $400 por clases y el B cobra $1.500 más $450 por clases. Con un uso de 34 clases al mes, ¿qué plan conviene y cuánto se ahorra?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Plan A: $3.000 + $400 por clases Plan B: $1.500 + $450 por clases Uso mensual estimado: 34 clases\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan A: $3.000 + $400 por clases<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan B: $1.500 + $450 por clases<\/text><text x=\"280.0\" y=\"122.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Uso mensual estimado: 34 clases<\/text><\/svg>","o":["El plan A, con un ahorro de $200","El plan B, con un ahorro de $200","El plan A, con un ahorro de $1.500","El plan B, con un ahorro de $2.200","El plan A, con un ahorro de $50"],"s":"Modelar","e":"Costo A = $16.600 y costo B = $16.800: conviene el plan A."},{"q":"Sobre comparar planes con funciones lineales, ¿cuál afirmación es incorrecta?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Modelos lineales de tarifas C(n) = cargo fijo + costo por unidad · n\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Modelos lineales de tarifas<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">C(n) = cargo fijo + costo por unidad · n<\/text><\/svg>","o":["En C(n) = a + bn, a es el costo por unidad y b es el cargo fijo","Dos tarifas lineales se cruzan en el uso en que sus costos son iguales","Una función lineal f(x) = kx representa una relación de proporcionalidad directa","Después del punto de cruce, conviene el plan de menor pendiente","En C(n) = a + bn, a es el cargo fijo y b es el costo por unidad"],"s":"Argumentar","e":"Solo una afirmación contradice el modelo C(n) = a + bn."},{"q":"En un club deportivo, se pagan $4.000 por hasta 5 clases y $200 por cada clases adicional sobre ese límite. ¿Cuánto se paga si se usan 14 clases?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Un club deportivo: hasta 5 clases: $4.000 en total cada clases adicional: $200\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Un club deportivo:<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">hasta 5 clases: $4.000 en total<\/text><text x=\"280.0\" y=\"122.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">cada clases adicional: $200<\/text><\/svg>","o":["$5.800","$6.800","$2.800","$6.000","$3.800"],"s":"Modelar","e":"Se paga el cargo por el límite más 9 unidades adicionales: 4000 + 200·9 = 5800."},{"q":"Un cliente dice: «El plan B siempre es más barato que el plan A porque cobra menos por días». ¿Es correcta su afirmación?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Plan A: $3.000 + $250 por días Plan B: $6.000 + $150 por días\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan A: $3.000 + $250 por días<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan B: $6.000 + $150 por días<\/text><\/svg>","o":["No: con menos de 30 días el plan A es más barato, porque su cargo fijo es menor","Sí: el plan B es más barato con cualquier uso, porque su pendiente es menor","No: con más de 30 días el plan A es más barato, porque su cargo fijo es menor","Sí: con 30 días el plan B es más barato que el plan A","No: ambos planes cuestan lo mismo con cualquier uso mensual"],"s":"Argumentar","e":"Ambos cuestan lo mismo con 30 días; antes conviene A (menor cargo fijo) y después B (menor costo por días)."},{"q":"El costo mensual de un arriendo de auto es C(n) = 8000 + 400n pesos, con n la cantidad de días. Si se pagaron $10.800, ¿cuántos días se usaron?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Tarifa de arriendo de auto Cargo fijo: $8.000 Por cada días: $400\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Tarifa de arriendo de auto<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Cargo fijo: $8.000<\/text><text x=\"280.0\" y=\"122.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Por cada días: $400<\/text><\/svg>","o":["7","27","47","2800","8"],"s":"Resolver problemas","e":"8000 + 400n = 10800 ⟹ n = 7."},{"q":"El plan A cuesta C_A(n) = 2000 + 500n y el plan B cuesta C_B(n) = 5250 + 250n, con n la cantidad de kilómetros. ¿Para qué valor de n ambos planes cuestan lo mismo?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Plan A: $2.000 + $500 por km Plan B: $5.250 + $250 por km\  y costo por unidad."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: Plan: 3000 fijos y 200 por unidad C(n) = 200 + 3000n\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan: 3000 fijos y 200 por unidad<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">C(n) = 200 + 3000n<\/text><\/svg>","o":["Intercambió el cargo fijo y el costo por unidad: el costo por unidad multiplica a n","Sumó ambos valores y multiplicó el total por n para obtener el costo","Restó el costo unitario del cargo fijo antes de multiplicar por n","Dejó el costo por unidad sin variable y multiplicó solo el cargo fijo","Escribió correctamente la función pero cambió la variable por otra letra"],"s":"Argumentar","e":"Intercambió el cargo fijo y el costo por unidad: el costo por unidad multiplica a n."},{"q":"Sobre comparar planes con funciones lineales, ¿cuál afirmación es correcta?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Modelos lineales de tarifas C(n) = cargo fijo + costo por unidad · n\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Modelos lineales de tarifas<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">C(n) = cargo fijo + costo por unidad · n<\/text><\/svg>","o":["En C(n) = a + bn, a es el cargo fijo y b es el costo por unidad","Basta comparar los precios por unidad para decidir cuál plan conviene","Dos tarifas lineales con distinta pendiente nunca se cruzan","El plan con menor cargo fijo es más barato para cualquier uso","En C(n) = a + bn, a es el costo por unidad y b es el cargo fijo"],"s":"Argumentar","e":"Se contrasta con el significado de cargo fijo y costo por unidad."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: Dos planes con pendientes 300 y 400 El de pendiente menor siempre es más barato\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Dos planes con pendientes 300 y 400<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">El de pendiente menor siempre es más barato<\/text><\/svg>","o":["No consideró el cargo fijo: un plan de menor pendiente puede ser más caro para poco uso","Consideró que la pendiente menor implica un cargo fijo mayor en todos los casos","Comparó los costos solo cuando el uso es cero y concluyó con ese valor","Supuso que ambas rectas se cruzan siempre en el origen del plano cartesiano","Comparó las pendientes pero olvidó que el costo depende también de n"],"s":"Argumentar","e":"No consideró el cargo fijo: un plan de menor pendiente puede ser más caro para poco uso."},{"q":"El costo mensual de un plan de telefonía es C(n) = 6000 + 500n pesos, con n la cantidad de minutos. Si se pagaron $21.500, ¿cuántos minutos se usaron?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Tarifa de plan de telefonía Cargo fijo: $6.000 Por cada min: $500\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Tarifa de plan de telefonía<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Cargo fijo: $6.000<\/text><text x=\"280.0\" y=\"122.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Por cada min: $500<\/text><\/svg>","o":["31","43","55","15500","32"],"s":"Resolver problemas","e":"6000 + 500n = 21500 ⟹ n = 31."},{"q":"Para un plan de internet se comparan dos planes: el A cobra $5.000 más $250 por GB y el B cobra $4.500 más $300 por GB. Con un uso de 33 GB al mes, ¿qué plan conviene y cuánto se ahorra?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Plan A: $5.000 + $250 por GB Plan B: $4.500 + $300 por GB Uso mensual estimado: 33 GB\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\"  A: $2.000 + $600 por kWh<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan B: $5.000 + $300 por kWh<\/text><\/svg>","o":["10","10/3","70/3","15","9"],"s":"Resolver problemas","e":"2000 + 600n = 5000 + 300n ⟹ 300n = 3000 ⟹ n = 10."},{"q":"Una función lineal f(x) = kx cumple f(14) = 56. ¿Cuál es el valor de k?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Función lineal (proporcional): f(x) = kx\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Función lineal (proporcional):<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = kx<\/text><\/svg>","o":["4","42","1/4","70","5"],"s":"Resolver problemas","e":"k = f(14)/14 = 4."},{"q":"El plan A cuesta C_A(n) = 3000 + 400n y el plan B cuesta C_B(n) = 10800 + 200n, con n la cantidad de kilómetros. ¿Para qué valor de n ambos planes cuestan lo mismo?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Plan A: $3.000 + $400 por km Plan B: $10.800 + $200 por km\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan A: $3.000 + $400 por km<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sa const MAX_GAP=16;
const SKILLS=["Resolver problemas","Modelar","Representar","Argumentar"];
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
// Validación en el navegador: 5 opciones únicas y correcta <= distractor más largo + 16.
function valid(q){
  if(!q||!Array.isArray(q.o)||q.o.length!==5||new Set(q.o).size!==5)return false;
  const longest=Math.max(...q.o.slice(1).map(s=>[...s].length));
  return [...q.o[0]].length-longest<=MAX_GAP;
}
const GOOD=BANK.filter(valid);
if(GOOD.length!==BANK.length)console.warn("Preguntas descartadas por validación:",BANK.length-GOOD.length);
function pick(){
  const base=Math.floor(CFG.n/SKILLS.length), extra=CFG.n%SKILLS.length, out=[];
  // Las preguntas sobrantes (p. ej. 10 = 3+3+2+2) se reparten al azar entre las habilidades.
  shuffle(SKILLS).forEach((s,i)=>{
    const pool=shuffle(GOOD.filter(q=>q.s===s));
    out.push(...pool.slice(0,base+(i<extra?1:0)));
  });
  // Si algún eje quedó corto, completa desde el resto del banco.
  if(out.length<CFG.n){const rest=shuffle(GOOD.filter(q=>!out.includes(q)));out.push(...rest.slice(0,CFG.n-out.length))}
  // >= 90% con imagen: reemplaza sin imagen por otras con imagen si hiciera falta.
  const need=Math.ceil(CFG.n*0.9);
  while(out.filter(q=>q.svg).length<need){
    const i=out.findIndex(q=>!q.svg);const alt=shuffle(GOOD.filter(q=>q.svg&&!out.includes(q)))[0];
    if(i<0||!alt)break;out[i]=alt;
  }
  return shuffle(out);
}
function prepare(q){
  // Baraja las opciones; evita rachas de 3 letras iguales en la correcta.
  return {...q,ord:shuffle([0,1,2,3,4])};
}
function build(){
  for(let t=0;t<200;t++){
    const qs=pick().map(prepare);
    const pos=qs.map(q=>q.ord.indexOf(0));
    const run=pos.some((p,i)=>i>1&&p===pos[i-1]&&p===pos[i-2]);
    const cnt=[0,0,0,0,0];pos.forEach(p=>cnt[p]++);

}

  h.firstChild.textContent=score+" / "+Q.length;h.lastChild.textContent="Porcentaje de logro: "+Math.round(score/Q.length*100)+"%  ·  Tiempo: "+Math.floor(s/60)+" min "+(s%60)+" s";
  app.append(h);
  const tb=document.createElement("table");tb.innerHTML="<tr><th>Habilidad PAES</th><th>Correctas</th></tr>";
  SKILLS.forEach(k=>{const tr=document.createElement("tr");tr.innerHTML="<td></td><td></td>";tr.children[0].textContent=k;tr.children[1].textContent=by[k][0]+" / "+by[k][1];tb.append(tr)});
  app.append(tb);
  answers.forEach((a,n)=>{
    const d=document.createElement("div");d.className="rev";
    const t=document.createElement("div");t.innerHTML='<b></b> <span></span>';
    t.firstChild.className=a.ok?"tag-ok":"tag-bad";t.firstChild.textContent=(n+1)+(a.ok?" ✔":" ✘");t.lastChild.textContent=a.q.q;d.append(t);
    if(a.q.svg){const f=document.createElement("div");f.className="fig";f.style.maxWidth="420px";f.style.marginTop="8px";f.innerHTML=a.q.svg;d.append(f)}
    const c=document.createElement("div");c.textContent="Respuesta correcta: "+a.q.o[0]+". "+a.q.e;d.append(c);app.append(d);
  });
  const b=document.createElement("button");b.className="btn";b.textContent="Nuevo intento (otras preguntas)";b.onclick=start;app.append(b);
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{const o=document.querySelectorAll(".opt:not(:disabled)");if(o.length&&"12345".includes(e.key))o[+e.key-1]?.click();else if(e.key==="Enter"){const n=document.querySelector(".btn");n&&n.click()}});
start();
</script>
</body>
</html>
