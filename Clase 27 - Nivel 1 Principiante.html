<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 · Clase 27 · Principiante</title>
<style>
:root{--primary:#4B2363;--accent:#B37D48;--level:#166534;--ink:#0F172A;--bg:#F8FAFC;--card:#fff;--ok:#166534;--bad:#991B1B;--line:#CBD5E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#fff;border-top:6px solid var(--primary);border-bottom:5px solid var(--level);display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.logo{height:92px;width:auto;flex:0 0 auto}
.logo img{height:100%;width:auto;display:block}
@media(max-width:640px){header{position:static}.logo{height:80px}}
.badge{background:var(--level);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px}
.meta{margin-left:auto;font-weight:700;font-size:15px}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{height:10px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:4px 0 16px}
.bar>i{display:block;height:100%;background:var(--level);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.skill{display:inline-block;background:#E0E7FF;color:#1E1B4B;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.stem{font-size:19px;font-weight:600;margin:4px 0 12px}
.fig{border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px;background:#fff}
.fig svg{display:block;width:100%;height:auto;max-height:340px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;color:var(--ink);cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--level)}
.opt b{flex:0 0 32px;height:32px;border-radius:50%;background:var(--level);color:#fff;display:grid;place-items:center;font-size:15px}
.opt.ok{border-color:var(--ok);background:#DCFCE7}
.opt.bad{border-color:var(--bad);background:#FEE2E2}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:#F1F5F9;border-left:6px solid var(--level);display:none}
.btn{background:var(--level);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:800;cursor:pointer;margin-top:14px}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.big{font-size:44px;font-weight:900;color:var(--level)}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.tag-ok{color:var(--ok);font-weight:800}.tag-bad{color:var(--bad);font-weight:800}
</style>
</head>

#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Una ecuación cuadrática tiene<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">soluciones x = −3 y x = 6<\/text><\/svg>","o":["x² − 3x − 18 = 0","x² + 3x − 18 = 0","x² − 3x + 18 = 0","x² + 3x + 18 = 0","x² + 18x + 3 = 0"],"s":"Resolver problemas","e":"(x − −3)(x − 6) = 0 se desarrolla como x² − 3x − 18 = 0."},{"q":"Un rectángulo tiene lados de x cm y (x + 2) cm y su área es 48 cm². ¿Cuánto mide el lado menor?","svg":"<svg viewBox=\"0 0 560 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Rectángulo de lados x y x + k\"><rect width=\"560\" height=\"200\" fill=\"#FFFFFF\"/><rect x=\"140.0\" y=\"40.0\" width=\"260.0\" height=\"110.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"234.1\" y=\"150.0\" width=\"71.8\" height=\"30\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"270.0\" y=\"171.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x + 2<\/text><rect x=\"96.4\" y=\"80.0\" width=\"27.2\" height=\"30\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"110.0\" y=\"101.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x<\/text><text x=\"270.0\" y=\"105.0\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Área = 48<\/text><\/svg>","o":["6 cm","8 cm","−8 cm","46 cm","7 cm"],"s":"Modelar","e":"x(x + 2) = 48 ⟹ x² + 2x − 48 = 0 ⟹ x = 6 (la solución negativa no sirve como longitud)."},{"q":"¿Cuál es el conjunto solución de la ecuación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resuelve la ecuación: (x + 2)(x − 3) = 0\"><rect width=\"56 : una longitud es positiva."},{"q":"¿Qué se puede afirmar sobre las soluciones de la ecuación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ecuación: 2x² − 2x + 5 = 0\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Ecuación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2x² − 2x + 5 = 0<\/text><\/svg>","o":["No tiene soluciones reales, porque Δ = −36 es negativo","Tiene dos soluciones reales distintas, porque Δ = −36 es positivo","Tiene una solución real doble, porque Δ = 0","Tiene dos soluciones reales, porque el coeficiente de x² es positivo","Tiene infinitas soluciones, porque es una ecuación de segundo grado"],"s":"Argumentar","e":"El signo del discriminante determina la cantidad de soluciones reales."},{"q":"¿Qué se puede afirmar sobre las soluciones de la ecuación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ecuación: x² + 2x + 1 = 0\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Ecuación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x² + 2x + 1 = 0<\/text><\/svg>","o":["Tiene una solución real doble, porque Δ = 0","Tiene dos soluciones reales distintas, porque Δ = 0 es posi iddle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resuelve la ecuación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">(x + 3)(x − 4) = 0<\/text><\/svg>","o":["x = −3 y x = 4","x = −4 y x = 3","x = −4 y x = −3","x = 3 y x = 4","x = −2 y x = 4"],"s":"Resolver problemas","e":"Las soluciones son x = −3 y x = 4."},{"q":"La altura de una pelota se modela con h(t) = −5t² + 15t (h en metros, t en segundos desde el lanzamiento). ¿Después de cuántos segundos vuelve al suelo?","svg":"<svg viewBox=\"0 0 560 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Altura de una pelota (m): h(t) = −5t² + 15t t en segundos\"><rect width=\"560\" height=\"150\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"100.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"57.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Altura de una pelota (m):<\/text><text x=\"280.0\" y=\"82.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">h(t) = −5t² + 15t<\/text><text x=\"280.0\" y=\"107.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">t en segundos<\/text><\/svg>","o":["3 s","0 s","4 s","15 s","6 s"],"s":"Modelar","e":"h(t) = 0 ⟹ 5t(−t + 3) = 0 ⟹ t = 0 (lanzamiento) o t = 3: vuelve al suelo a los 3 s."},{"q":"Para la ecuación x² + 3x − 7 = 0, ¿cuál es el valor del discriminante Δ = b² − 4ac?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ecuación: x² + 3x − 7 = 0 Δ = b² − 4ac\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width= ,"14"],"s":"Resolver problemas","e":"Δ = (2)² − 4·(1)·(−3) = 16."},{"q":"Al resolver el problema de un rectángulo de lados x y (x + 3) con área 108 cm², se obtienen las soluciones x = 9 y x = −12. ¿Qué solución es válida para la medida del lado y por qué?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"x(x + 3) = 108 Soluciones: x = 9 y x = −12 x es la medida de un lado en cm\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x(x + 3) = 108<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Soluciones: x = 9 y x = −12<\/text><text x=\"280.0\" y=\"122.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x es la medida de un lado en cm<\/text><\/svg>","o":["x = 9, porque una longitud no puede ser negativa","x = −12, porque es la solución de mayor valor absoluto","Ambas, porque las dos cumplen la ecuación cuadrática planteada","Ninguna, porque el área no puede ser 108 cm²","x = 9, porque es la solución que se obtiene primero"],"s":"Argumentar","e":"Toda solución debe interpretarse en el contexto: una longitud es positiva."},{"q":"¿Cuál es el conjunto solución de la ecuación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resuelve la ecuación: (x + 3)(x − 8) = 0\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" const MAX_GAP=16;
const SKILLS=["Resolver problemas","Modelar","Representar","Argumentar"];
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
// Validación en el navegador: 5 opciones únicas y correcta <= distractor más largo + 16.
function valid(q){
  if(!q||!Array.isArray(q.o)||q.o.length!==5||new Set(q.o).size!==5)return false;
  const longest=Math.max(...q.o.slice(1).map(s=>[...s].length));
  return [...q.o[0]].length-longest<=MAX_GAP;
}
const GOOD=BANK.filter(valid);
if(GOOD.length!==BANK.length)console.warn("Preguntas descartadas por validación:",BANK.length-GOOD.length);
function pick(){
  const base=Math.floor(CFG.n/SKILLS.length), extra=CFG.n%SKILLS.length, out=[];
  // Las preguntas sobrantes (p. ej. 10 = 3+3+2+2) se reparten al azar entre las habilidades.
  shuffle(SKILLS).forEach((s,i)=>{
    const pool=shuffle(GOOD.filter(q=>q.s===s));
    out.push(...pool.slice(0,base+(i<extra?1:0)));
  });
  // Si algún eje quedó corto, completa desde el resto del banco.
  if(out.length<CFG.n){const rest=shuffle(GOOD.filter(q=>!out.includes(q)));out.push(...rest.slice(0,CFG.n-out.length))}
  // >= 90% con imagen: reemplaza sin imagen por otras con imagen si hiciera falta.
  const need=Math.ceil(CFG.n*0.9);
  while(out.filter(q=>q.svg).length<need){
    const i=out.findIndex(q=>!q.svg);const alt=shuffle(GOOD.filter(q=>q.svg&&!out.includes(q)))[0];
    if(i<0||!alt)break;out[i]=alt;
  }
  return shuffle(out);
}
function prepare(q){
  // Baraja las opciones; evita rachas de 3 letras iguales en la correcta.
  return {...q,ord:shuffle([0,1,2,3,4])};
}
function build(){
  for(let t=0;t<200;t++){
    const qs=pick().map(prepare);
    const pos=qs.map(q=>q.ord.indexOf(0));
    const run=pos.some((p,i)=>i>1&&p===pos[i-1]&&p===pos[i-2]);
    const cnt=[0,0,0,0,0];pos.forEach(p=>cnt[p]++);
    if(!run&&Math.max(...cnt)<=Math.ceil(CFG.n/5)+1)return qs;
  }
  return pick().map(prepare);
}
let Q,idx,score,answers,t0,timer;
const $=id=>document.getElementById(id);
function start(){
  Q=build();idx=0;score=0;answers=[];t0=Date.now();
  clearInterval(timer);timer=setInterval(tick,1000);render();
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("meta").textContent="⏱ "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+"  ·  "+Math.min(idx+1,Q.length)+"/"+Q.length}
function render(){
  tick();$("bar").style.width=(idx/Q.length*100)+"%";
  const q=Q[idx],app=$("app");
  app.innerHTML="";
  const sk=document.createElement("span");sk.className="skill";sk.textContent="Habilidad: "+q.s;app.append(sk);
  const st=document.createElement("div");st.className="stem";st.textContent=(idx+1)+". "+q.q;app.append(st);
  if(q.svg){const f=document.createElement("div");f.className="fig";f.innerHTML=q.svg;app.append(f)}
  const box=document.createElement("div");box.className="opts";
  q.ord.forEach((k,i)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";
    const l=document.createElement("b");l.textContent="ABCDE"[i];const t=document.createElement("span");t.textContent=q.o[k];
    b.append(l,t);b.onclick=()=>answer(i,box,b);box.append(b);
  });
  app.append(box);
  const fb=document.createElement("div");fb.className="fb";fb.id="fb";app.append(fb);
}
function answer(i,box,btn){
  const q=Q[idx],good=q.ord.indexOf(0),ok=i===good;
  [...box.children].forEach((b,j)=>{b.disabled=true;if(j===good)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  if(ok)score++;answers.push({q,ok,pick:i});
  const fb=$("fb");fb.style.display="block";
  fb.innerHTML="";const h=document.createElement("b");h.className=ok?"tag-ok":"tag-bad";h.textContent=ok?"¡Correcto! ":"Incorrecto. ";
  fb.append(h,document.createTextNode(q.e));
  const nx=document.createElement("button");nx.className="btn";nx.type="button";nx.textContent=idx===Q.length-1?"Ver resultados":"Siguiente →";
  nx.onclick=()=>{idx++;idx>=Q.length?finish():render()};$("app").append(nx);nx.focus();
}
function finish(){
  clearInterval(timer);$("bar").style.width="100%";
  const s=Math.floor((Date.now()-t0)/1000),app=$("app");
  const by={};SKILLS.forEach(k=>by[k]=[0,0]);answers.forEach(a=>{by[a.q.s][1]++;if(a.ok)by[a.q.s][0]++});
  app.innerHTML="";
  const h=document.createElement("div");h.innerHTML='<div class="big"></div><p></p>';
  h.firstChild.textContent=score+" / "+Q.length;h.lastChild.textContent="Porcentaje de logro: "+Math.round(score/Q.length*100)+"%  ·  Tiempo: "+Math.floor(s/60)+" min "+(s%60)+" s";
  app.append(h);
  const tb=document.createElement("table");tb.innerHTML="<tr><th>Habilidad PAES</th><th>Correctas</th></tr>";
  SKILLS.forEach(k=>{const tr=document.createElement("tr");tr.innerHTML="<td></td><td></td>";tr.children[0].textContent=k;tr.children[1].textContent=by[k][0]+" / "+by[k][1];tb.append(tr)});
  app.append(tb);
  answers.forEach((a,n)=>{
    const d=document.createElement("div");d.className="rev";
    const t=document.createElement("div");t.innerHTML='<b></b> <span></span>';
    t.firstChild.className=a.ok?"tag-ok":"tag-bad";t.firstChild.textContent=(n+1)+(a.ok?" ✔":" ✘");t.lastChild.textContent=a.q.q;d.append(t);
    if(a.q.svg){const f=document.createElement("div");f.className="fig";f.style.maxWidth="420px";f.style.marginTop="8px";f.innerHTML=a.q.svg;d.append(f)}
    const c=document.createElement("div");c.textContent="Respuesta correcta: "+a.q.o[0]+". "+a.q.e;d.append(c);app.append(d);
  });
  const b=document.createElement("button");b.className="btn";b.textContent="Nuevo intento (otras preguntas)";b.onclick=start;app.append(b);
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{const o=document.querySelectorAll(".opt:not(:disabled)");if(o.length&&"12345".includes(e.key))o[+e.key-1]?.click();else if(e.key==="Enter"){const n=document.querySelector(".btn");n&&n.click()}});
start();
