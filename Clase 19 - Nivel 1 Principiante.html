<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 · Clase 19 · Principiante</title>
<style>
:root{--primary:#4B2363;--accent:#B37D48;--level:#166534;--ink:#0F172A;--bg:#F8FAFC;--card:#fff;--ok:#166534;--bad:#991B1B;--line:#CBD5E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#fff;border-top:6px solid var(--primary);border-bottom:5px solid var(--level);display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.logo{height:92px;width:auto;flex:0 0 auto}
.logo img{height:100%;width:auto;display:block}
@media(max-width:640px){header{position:static}.logo{height:80px}}
.badge{background:var(--level);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px}
.meta{margin-left:auto;font-weight:700;font-size:15px}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{height:10px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:4px 0 16px}
.bar>i{display:block;height:100%;background:var(--level);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.skill{display:inline-block;background:#E0E7FF;color:#1E1B4B;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.stem{font-size:19px;font-weight:600;margin:4px 0 12px}
.fig{border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px;background:#fff}
.fig svg{display:block;width:100%;height:auto;max-height:340px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;color:var(--ink);cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--level)}
.opt b{flex:0 0 32px;height:32px;border-radius:50%;background:var(--level);color:#fff;display:grid;place-items:center;font-size:15px}
.opt.ok{border-color:var(--ok);background:#DCFCE7}
.opt.bad{border-color:var(--bad);background:#FEE2E2}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:#F1F5F9;border-left:6px solid var(--level);display:none}
.btn{background:var(--level);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:800;cursor:pointer;margin-top:14px}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.big{font-size:44px;font-weight:900;color:var(--level)}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.tag-ok{color:var(--ok);font-weight:800}.tag-bad{color:var(--bad);font-weight:800}
</style>
</head>

"Modelar","e":"a + n = 72; 3000a + 1500n = 172500 ⟹ a = 43."},{"q":"Si (x, y) es la solución del sistema de la figura, ¿cuál es el valor de x + y?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sistema: 2x − y = 18 x + y = 0\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sistema:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2x − y = 18<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x + y = 0<\/text><\/svg>","o":["0","12","−36","6","−6"],"s":"Resolver problemas","e":"x = 6, y = −6, luego x + y = 0."},{"q":"¿Qué método resulta más rápido para resolver el sistema de la figura y por qué?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sistema: y = 2x 6x + 2y = 20\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sistema:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">y = 2x<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">6x + 2y = 20<\/text><\/svg>","o":["Sustitución, porque una incógnita ya está des  fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sistemas de ecuaciones 2x2<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sustitución · Igualación · Reducción<\/text><\/svg>","o":["Dos rectas distintas siempre se cortan en exactamente un punto","Los métodos de sustitución y reducción entregan la misma solución","Si una incógnita ya está despejada, conviene sustituirla en la otra ecuación","La solución de un sistema de dos rectas que se cruzan es su punto de intersección","Multiplicar una ecuación por un número distinto de cero no cambia su solución"],"s":"Argumentar","e":"Solo una afirmación contradice la definición de solución de un sistema."},{"q":"Para el sistema de la figura, ¿qué se puede afirmar sobre el par (x, y) indicado?","svg":"<svg viewBox=\"0 0 560 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"3x + 4y = 22 3x − 4y = −34 ¿Es (x, y) = (2, 4) solución?\"><rect width=\"560\" height=\"190\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"140.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3x + 4y = 22<\/text><text x=\"280.0\" y=\"102.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3x − 4y = −34<\/text><text x=\"280.0\" y=\"137.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">¿Es (x, y) = (2, 4) solución?<\/text><\/svg>","o":["No, el par cumple solo la primera ecuación","Sí, el par cumple ambas ecuaciones","No, el par cumple solo la segunda ecuación","No, el par no cumple ninguna de las dos ecuaciones","No se puede saber sin resolver el sistema completo"],"s":"Argumentar","e":"Un par es solución solo si cumple simultáneamente ambas ecuaciones."},{"q":"¿Qué método resulta más rápido para resolver el sistema de la figura y por qué?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sistema: y = 4x 6x + 3y = 36\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sistema:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">y = 4x<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">6x + 3y = 36<\/text><\/svg>","o":["Sustitución, porque una incógnita ya está despejada en la primera ecuación","Reducción, porque los coeficientes de y son opuestos y se anulan al sumar","Igualación, porque ambas ecuaciones tienen la misma incógnita despejada","Reducción, porque las dos ecuaciones tienen el mismo término independiente","Sustitución, porque hay que despejar una incógnita antes de cualquier otro paso"],"s":"Argumentar","e":"Se elige el método según cómo están escritas las ecuaciones."},{"q":"En una función asistieron 108 personas entre adultos y niños. Las entradas de adulto cuestan $4.000 y las de niño $2.500, y se recaudaron $378.000. ¿Cuántos adultos asistieron?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Entradas de adulto: $4.000 Entradas de niño: $2.500 Personas: 108  ·  Recaudación: $378.000\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\" ución del sistema","La solución de un sistema de dos rectas que se cruzan es su punto de intersección","La solución de un sistema es el par de valores que cumple ambas ecuaciones a la vez","Al sumar dos ecuaciones se suman los lados izquierdos y los lados derechos","Multiplicar una ecuación por un número distinto de cero no cambia su solución"],"s":"Argumentar","e":"Solo una afirmación contradice la definición de solución de un sistema."},{"q":"Para el sistema de la figura, ¿qué se puede afirmar sobre el par (x, y) indicado?","svg":"<svg viewBox=\"0 0 560 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"2x + y = −4 2x − 3y = 4 ¿Es (x, y) = (2, −8) solución?\"><rect width=\"560\" height=\"190\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"140.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2x + y = −4<\/text><text x=\"280.0\" y=\"102.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2x − 3y = 4<\/text><text x=\"280.0\" y=\"137.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">¿Es (x, y) = (2, −8) solución?<\/text><\/svg>","o":["No, el par cumple solo la primera ecuación","Sí, el par cumple ambas ecuaciones","No, el par cumple solo la segunda ecuación","No, el par no cumple ninguna de las dos ecuaciones","No se puede saber sin resolver el sistema completo"],"s":"Argumentar","e":"Un par es solución solo si cumple simultáneamente ambas ecuaciones."},{"q":"Sobre resolver sistemas de dos ecuaciones, ¿cuál afirmación es correcta?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sistemas de ecuaciones 2x2 Sustitución · Igualación · Reducción\"><rect width=\"560\" height=\"130 ize=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">1 cuadernos + 1 lápices → $1.500<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">1 cuadernos + 2 lápices → $2.100<\/text><\/svg>","o":["1c + 1l = 1500 ; 1c + 2l = 2100","1c + 1l = 2100 ; 1c + 2l = 1500","1c + 1l = 1500 ; 2c + 1l = 2100","1c + 1l = 1500 ; 1c − 2l = 2100","2cl = 1500 ; 3cl = 2100"],"s":"Modelar","e":"Cada compra da una ecuación: cantidad de cada producto por su precio, igualada al total."},{"q":"Para el sistema de la figura, ¿qué se puede afirmar sobre el par (x, y) indicado?","svg":"<svg viewBox=\"0 0 560 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"2x + 2y = 12 2x + y = 10 ¿Es (x, y) = (4, 2) solución?\"><rect width=\"560\" height=\"190\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"140.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2x + 2y = 12<\/text><text x=\"280.0\" y=\"102.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2x + y = 10<\/text><text x=\"280.0\" y=\"137.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">¿Es (x, y) = (4, 2) solución?<\/text><\/svg>","o":["Sí, el par cumple ambas ecuaciones","No, el par cumple solo la primera ecuación","No, el par cumple solo la segunda ecuación","No, el par no cumple ninguna de las dos ecuaciones","No se puede saber sin resolver el sistema completo"],"s":"Argumentar","e":"Un par es solución solo si cumple simultáneamente ambas ecuaciones."},{"q":"¿Cuál de las siguientes afirmaciones sobre sistemas de ecuaciones es verdadera?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sistemas de ecuaciones 2x2 Sustitución · Igualación · Reducción\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sistemas de ecuaciones 2x2<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sustitución · Igualación · Reducción<\/text><\/svg>","o":["Multiplicar una ecuación por un número distinto de cero no cambia su solución","Los métodos de sustitución y reducción pueden entregar soluciones distintas","La solución de un sistema es el punto donde una recta corta al eje Y","Al sumar dos ecuaciones solo se suman los lados izquierdos","Multiplicar una ecuación por cero mantiene la solución del sistema"],"s":"Argumentar","e":"Se contrasta con la definición de solución de un sistema."},{"q":"¿Cuál de las siguientes afirmaciones sobre sistemas de ecuaciones es falsa?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sistemas de ecuaciones 2x2 Sustitución · Igualación · Reducción\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sistemas de ecuaciones 2x2<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sustitución · Igualación · Reducción<\/text><\/svg>","o":["Un par que cumple solo una ecuación es solución del sistema","Multiplicar una ecuación por un número distinto de cero no cambia su solución","La solución de un sistema es el par de valores que cumple ambas ecuaciones a la vez","Si una incógnita ya está despejada, conviene sustituirla en la otra ecuación","Al sumar dos ecuaciones se suman los lados izquierdos y los lados derechos"],"s":"Argumentar","e":"Solo una afirmación contradice la definición de solución de un sistema."},{"q":"En una función asistieron 100 personas entre adultos y niños. Las entradas de adulto cuestan $3.000 y las de niño $1.500, y se recaudaron $258.000. ¿Cuántos adultos asistieron?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Entradas de adulto: $3.000 Entradas de niño: $1.500 Personas: 100  ·  Recaudación: $258.000\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Entradas de adulto: $3.000<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Entradas de niño: $1.500<\/text><text x=\"280.0\" y=\"122.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Personas: 100  ·  Recaudación: $258.000<\/text><\/svg>","o":["72","28","27","50","82"],"s":"Modelar","e":"a + n = 100; 3000a + 1500n = 258000 ⟹ a = 72."},{"q":"¿Qué método resulta más rápido para resolver el sistema de la figura y por qué?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sistema: 6x + 3y = 24 7x − 3y = 15\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sistema:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">6x + 3y = 24<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">7x − 3y = 15<\/text><\/svg>","o":["Reducción, porque los coeficientes de y son opuestos y se anulan al sumar","Sustitución, porque una incógnita ya está despejada en la primera ecuación","Igualación, porque ambas ecuaciones tienen la misma incógnita despejada","Reducción, porque las dos ecuaciones tienen el mismo término independiente","Sustitución, porque hay que despejar una incógnita antes de cualquier otro paso"],"s":"Argumentar","e":"Se elige el método según cómo están escritas las ecuaciones."},{"q":"Para el sistema de la figura, ¿qué se puede afirmar sobre el par (x, y) indicado?","svg":"<svg viewBox=\"0 0 560 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"3x + 3y = 15 3x − 3y = −9 ¿Es (x, y) = (1, 4) solución?\"><rect width=\"560\" height=\"190\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"140.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3x + 3y = 15<\/text><text x=\"280.0\" y=\"102.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3x − 3y = −9<\/text><text x=\"280.0\" y=\"137.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">¿Es (x, y) = (1, 4) solución?<\/text><\/svg>","o":["Sí, el par cumple ambas ecuaciones","No, el par cumple solo la primera ecuación","No, el par cumple solo la segunda ecuación","No, el par no cumple ninguna de las dos ecuaciones","No se puede saber sin resolver el sistema completo"],"s":"Argumentar","e":"Un par es solución solo si cumple simultáneamente ambas ecuaciones."},{"q":"La tabla muestra los valores de y en dos rectas para distintos valores de x. ¿Cuál es la solución (x, y) del sistema formado por ambas rectas?","svg":"<svg viewBox=\"0 0 560 186\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Tabla\"><rect width=\"560\" height=\"186\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"30.0\" width=\"500.0\" height=\"42.0\" fill=\"#E0F2FE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"65.7\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x<\/text><text x=\"137.1\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">0<\/text><text x=\"208.6\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">1<\/text><text x=\"280.0\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2<\/text><text x=\"351.4\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3<\/text><text x=\"422.9\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">4<\/text><text x=\"494.3\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">5<\/text><rect x=\"30.0\" y=\"72.0\" width=\"500.0\" height=\"42.0\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"65.7\" y=\" =\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">4 cuadernos + 4 lápices → $2.800<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2 cuadernos + 3 lápices → $1.600<\/text><\/svg>","o":["4c + 4l = 2800 ; 2c + 3l = 1600","4c + 4l = 1600 ; 2c + 3l = 2800","4c + 4l = 2800 ; 3c + 2l = 1600","4c + 4l = 2800 ; 2c − 3l = 1600","8cl = 2800 ; 5cl = 1600"],"s":"Modelar","e":"Cada compra da una ecuación: cantidad de cada producto por su precio, igualada al total."},{"q":"Sobre resolver sistemas de dos ecuaciones, ¿cuál afirmación es correcta?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sistemas de ecuaciones 2x2 Sustitución · Igualación · Reducción\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sistemas de ecuaciones 2x2<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sustitución · Igualación · Reducción<\/text><\/svg>","o":["La solución de un sistema de dos rectas que se cruzan es su punto de intersección","Los métodos de sustitución y reducción pueden entregar soluciones distintas","La solución de un sistema es el punto donde una recta corta al eje Y","Multiplicar una ecuación por cero mantiene la solución del sistema","Dos rectas distintas siempre se cortan en exactamente un punto"],"s":"Argumentar","e":"Se contrasta con la definición de solución de un sistema."},{"q":"Si (x, y) es la solución del sistema de la figura, ¿cuál es el valor de x + y?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sistema: x − 5y = 23 4x + 5y = 17\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sistema:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x − 5y = 23<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">4x + 5y = 17<\/text><\/svg>","o":["5","11","−24","8","−3"],"s":"Resolver problemas","e":"x = 8, y = −3, luego x + y = 5."},{"q":"Si (x, y) es la solución del sistema de la figura, ¿cuál es el valor de x − y?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sistema: 4x + 5y = 28 3x − 5y = −49\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sistema:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">4x + 5y = 28<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3x − 5y = −49<\/text><\/svg>","o":["−11","5","1 const MAX_GAP=16;
const SKILLS=["Resolver problemas","Modelar","Representar","Argumentar"];
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
// Validación en el navegador: 5 opciones únicas y correcta <= distractor más largo + 16.
function valid(q){
  if(!q||!Array.isArray(q.o)||q.o.length!==5||new Set(q.o).size!==5)return false;
  const longest=Math.max(...q.o.slice(1).map(s=>[...s].length));
  return [...q.o[0]].length-longest<=MAX_GAP;
}
const GOOD=BANK.filter(valid);
if(GOOD.length!==BANK.length)console.warn("Preguntas descartadas por validación:",BANK.length-GOOD.length);
function pick(){
  const base=Math.floor(CFG.n/SKILLS.length), extra=CFG.n%SKILLS.length, out=[];
  // Las preguntas sobrantes (p. ej. 10 = 3+3+2+2) se reparten al azar entre las habilidades.
  shuffle(SKILLS).forEach((s,i)=>{
    const pool=shuffle(GOOD.filter(q=>q.s===s));
    out.push(...pool.slice(0,base+(i<extra?1:0)));
  });
  // Si algún eje quedó corto, completa desde el resto del banco.
  if(out.length<CFG.n){const rest=shuffle(GOOD.filter(q=>!out.includes(q)));out.push(...rest.slice(0,CFG.n-out.length))}
  // >= 90% con imagen: reemplaza sin imagen por otras con imagen si hiciera falta.
  const need=Math.ceil(CFG.n*0.9);
  while(out.filter(q=>q.svg).length<need){
    const i=out.findIndex(q=>!q.svg);const alt=shuffle(GOOD.filter(q=>q.svg&&!out.includes(q)))[0];
    if(i<0||!alt)break;out[i]=alt;
  }
  return shuffle(out);
}
function prepare(q){
  // Baraja las opciones; evita rachas de 3 letras iguales en la correcta.
  return {...q,ord:shuffle([0,1,2,3,4])};
}
function build(){
  for(let t=0;t<200;t++){
    const qs=pick().map(prepare);
    const pos=qs.map(q=>q.ord.indexOf(0));
    const run=pos.some((p,i)=>i>1&&p===pos[i-1]&&p===pos[i-2]);
    const cnt=[0,0,0,0,0];pos.forEach(p=>cnt[p]++);
    if(!run&&Math.max(...cnt)<=Math.ceil(CFG.n/5)+1)return qs;
  }
  return pick().map(prepare);
}
let Q,idx,score,answers,t0,timer;
const $=id=>document.getElementById(id);
function start(){
  Q=build();idx=0;score=0;answers=[];t0=Date.now();
  clearInterval(timer);timer=setInterval(tick,1000);render();
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("meta").textContent="⏱ "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+"  ·  "+Math.min(idx+1,Q.length)+"/"+Q.length}
function render(){
  tick();$("bar").style.width=(idx/Q.length*100)+"%";
  const q=Q[idx],app=$("app");
  app.innerHTML="";
  const sk=document.createElement("span");sk.className="skill";sk.textContent="Habilidad: "+q.s;app.append(sk);
  const st=document.createElement("div");st.className="stem";st.textContent=(idx+1)+". "+q.q;app.append(st);
  if(q.svg){const f=document.createElement("div");f.className="fig";f.innerHTML=q.svg;app.append(f)}
  const box=document.createElement("div");box.className="opts";
  q.ord.forEach((k,i)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";
    const l=document.createElement("b");l.textContent="ABCDE"[i];const t=document.createElement("span");t.textContent=q.o[k];
    b.append(l,t);b.onclick=()=>answer(i,box,b);box.append(b);
  });
  app.append(box);
  const fb=document.createElement("div");fb.className="fb";fb.id="fb";app.append(fb);
}
function answer(i,box,btn){
  const q=Q[idx],good=q.ord.indexOf(0),ok=i===good;
  [...box.children].forEach((b,j)=>{b.disabled=true;if(j===good)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  if(ok)score++;answers.push({q,ok,pick:i});
  const fb=$("fb");fb.style.display="block";
  fb.innerHTML="";const h=document.createElement("b");h.className=ok?"tag-ok":"tag-bad";h.textContent=ok?"¡Correcto! ":"Incorrecto. ";
  fb.append(h,document.createTextNode(q.e));
  const nx=document.createElement("button");nx.className="btn";nx.type="button";nx.textContent=idx===Q.length-1?"Ver resultados":"Siguiente →";
  nx.onclick=()=>{idx++;idx>=Q.length?finish():render()};$("app").append(nx);nx.focus();
}
function finish(){
  clearInterval(timer);$("bar").style.width="100%";
  const s=Math.floor((Date.now()-t0)/1000),app=$("app");
  const by={};SKILLS.forEach(k=>by[k]=[0,0]);answers.forEach(a=>{by[a.q.s][1]++;if(a.ok)by[a.q.s][0]++});
  app.innerHTML="";
  const h=document.createElement("div");h.innerHTML='<div class="big"></div><p></p>';
  h.firstChild.textContent=score+" / "+Q.length;h.lastChild.textContent="Porcentaje de logro: "+Math.round(score/Q.length*100)+"%  ·  Tiempo: "+Math.floor(s/60)+" min "+(s%60)+" s";
  app.append(h);
  const tb=document.createElement("table");tb.innerHTML="<tr><th>Habilidad PAES</th><th>Correctas</th></tr>";
  SKILLS.forEach(k=>{const tr=document.createElement("tr");tr.innerHTML="<td></td><td></td>";tr.children[0].textContent=k;tr.children[1].textContent=by[k][0]+" / "+by[k][1];tb.append(tr)});
  app.append(tb);
  answers.forEach((a,n)=>{
    const d=document.createElement("div");d.className="rev";
    const t=document.createElement("div");t.innerHTML='<b></b> <span></span>';
    t.firstChild.className=a.ok?"tag-ok":"tag-bad";t.firstChild.textContent=(n+1)+(a.ok?" ✔":" ✘");t.lastChild.textContent=a.q.q;d.append(t);
    if(a.q.svg){const f=document.createElement("div");f.className="fig";f.style.maxWidth="420px";f.style.marginTop="8px";f.innerHTML=a.q.svg;d.append(f)}
    const c=document.createElement("div");c.textContent="Respuesta correcta: "+a.q.o[0]+". "+a.q.e;d.append(c);app.append(d);
  });
  const b=document.createElement("button");b.className="btn";b.textContent="Nuevo intento (otras preguntas)";b.onclick=start;app.append(b);
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{const o=document.querySelectorAll(".opt:not(:disabled)");if(o.length&&"12345".includes(e.key))o[+e.key-1]?.click();else if(e.key==="Enter"){const n=document.querySelector(".btn");n&&n.click()}});
start();
</script>
